name: Publish API docker image to GitHub Container Registry
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (e.g., 1.0.0)"
        required: true
        type: string
      commit_sha:
        description: "Commit SHA to checkout (optional, defaults to the branch head)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
permissions:
  contents: read
jobs:
  upload:
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: dotnet publish --os linux --arch x64 /t:PublishContainer -c Release
        working-directory: backend/LiftLog.Api
      - name: Tag image
        env:
          VERSION: ${{ inputs.version_code }}
        run: |
          docker tag liftlog-api:latest ghcr.io/liammorrow/liftlog:api
          docker tag liftlog-api:latest "ghcr.io/liammorrow/liftlog:api-${VERSION}"
      - name: Push image
        env:
          VERSION: ${{ inputs.version_code }}
        run: |
          docker push ghcr.io/liammorrow/liftlog:api
          docker push "ghcr.io/liammorrow/liftlog:api-${VERSION}"
